name: BloodBank CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Executable Permissions to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compile and Run Test Suite
        run: ./mvnw clean test

      - name: Package Release Application
        run: ./mvnw package -DskipTests
