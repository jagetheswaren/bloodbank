spring.application.name=bloodbank-test

# H2 In-Memory Datasource Configuration for Testing
spring.datasource.url=jdbc:h2:mem:bloodbank_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Blood Bank Business Rule Configuration
bloodbank.donation.minimum-gap-days=90
bloodbank.inventory.near-expiry-days=7
bloodbank.blood-unit.shelf-life-days=42
bloodbank.demo.seed-enabled=false
