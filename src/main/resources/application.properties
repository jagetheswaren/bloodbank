spring.application.name=bloodbank

server.port=${SERVER_PORT:8080}

# MySQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloodbank_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Blood Bank Business Rule Configuration
bloodbank.donation.minimum-gap-days=90
bloodbank.inventory.near-expiry-days=7
bloodbank.blood-unit.shelf-life-days=42
bloodbank.demo.seed-enabled=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Spring Mail & SMTP Configuration (Environment variables with safe defaults)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

bloodbank.mail.enabled=${MAIL_ENABLED:false}
bloodbank.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@bloodbank.org}}
bloodbank.mail.admin-email=${BLOODBANK_ADMIN_EMAIL:admin@bloodbank.org}
bloodbank.mail.eligibility-reminders-enabled=${MAIL_ELIGIBILITY_REMINDERS_ENABLED:false}

