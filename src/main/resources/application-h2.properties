spring.application.name=bloodbank-h2

# H2 In-Memory Datasource Configuration (Zero Setup / Demo Mode)
spring.datasource.url=jdbc:h2:mem:bloodbank_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Blood Bank Business Rule Configuration
bloodbank.donation.minimum-gap-days=90
bloodbank.inventory.near-expiry-days=7
bloodbank.blood-unit.shelf-life-days=42
bloodbank.demo.seed-enabled=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Email Notifications (Disabled in H2 demo mode by default)
bloodbank.mail.enabled=false

