<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donors &mdash; Blood Bank Management</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('donors')}"></div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="app-main">
      <header th:replace="~{fragments/navbar :: navbar('Donors', 'Donors')}"></header>

      <div class="page-container animate-fade-in">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Registered Blood Donors</h1>
            <p class="page-subtitle">Manage donor profiles, contact information, status, and 90-day donation eligibility.</p>
          </div>
          <div class="page-actions">
            <a href="/donors/new" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
              </svg>
              Register New Donor
            </a>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-bar">
          <div class="search-input-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="donor-search-input" class="form-control search-input" placeholder="Search by name, code, email, or phone...">
          </div>

          <div style="display:flex;gap:0.75rem;">
            <select id="donor-bg-filter" class="form-control" style="width:auto;min-width:140px;">
              <option value="">All Blood Groups</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <!-- Donors Table -->
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Donor Code</th>
                <th>Full Name</th>
                <th>Blood Group</th>
                <th>Email Address</th>
                <th>Phone Number</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="donors-tbody">
              <!-- Rendered dynamically by donors.js -->
            </tbody>
          </table>
        </div>

      </div>

      <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
  </div>

  <script type="module" src="/js/donors.js"></script>
</body>
</html>
